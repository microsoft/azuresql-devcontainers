name: 'Smoke test'
description: 'Applies a template to a fresh workspace, brings it up, and runs its smoke test'
inputs:
  template:
    description: 'Template id, for example python'
    required: true
  mode:
    description: 'full (both containers), or nodb for optional app-only tooling checks'
    required: false
    default: 'full'

runs:
  using: composite
  steps:
    - name: Build template
      shell: bash
      env:
        TEMPLATE: ${{ inputs.template }}
        MODE: ${{ inputs.mode }}
        RUN_TAG: ci
      run: '"$GITHUB_ACTION_PATH/build.sh" "$TEMPLATE"'

    - name: Test template
      shell: bash
      env:
        TEMPLATE: ${{ inputs.template }}
        MODE: ${{ inputs.mode }}
        RUN_TAG: ci
      run: '"$GITHUB_ACTION_PATH/test.sh" "$TEMPLATE"'
